<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiveway Asset Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

    <header class="topbar">
      <img src="hiveway-_1_.gif" alt="Hiveway logo" class="logo" />

      <div>
        <h1>Asset Manager</h1>
        <p>Track company devices, Stripe terminals, test cards, and equipment assignments.</p>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <span id="totalAssets">0</span>
        <p>Total Assets</p>
      </div>

      <div class="stat">
        <span id="assignedAssets">0</span>
        <p>Assigned</p>
      </div>

      <div class="stat">
        <span id="availableAssets">0</span>
        <p>Available</p>
      </div>

      <div class="stat">
        <span id="issueAssets">0</span>
        <p>Repair / Lost</p>
      </div>
    </section>

    <section class="layout">

      <section class="card">
        <h2>Add Asset</h2>

        <form id="assetForm">
          <label>Asset Type</label>
          <select id="assetType" required>
            <option value="">Select asset type</option>
            <option>MacBook</option>
            <option>iPad</option>
            <option>iPhone</option>
            <option>Android Phone</option>
            <option>BBPOS WisePad 3</option>
            <option>BBPOS WisePOS E</option>
            <option>BBPOS WisePOS E Dock</option>
            <option>Stripe Reader M2</option>
            <option>Stripe Reader S700</option>
            <option>Stripe Terminal Test Card</option>
            <option>Interac Test Card</option>
            <option>Other</option>
          </select>

          <label>Model / Description</label>
          <input id="model" placeholder="Example: 14-inch MacBook Pro" />

          <label>Serial Number / Unique ID</label>
          <input id="serialNumber" placeholder="Serial number or unique identifier" required />

          <label>Assigned To</label>
          <input id="assignedTo" placeholder="Employee name" />

          <label>Employee Email</label>
          <input id="employeeEmail" placeholder="employee@company.com" />

          <label>Status</label>
          <select id="status">
            <option>Available</option>
            <option>Assigned</option>
            <option>Repair</option>
            <option>Retired</option>
            <option>Lost</option>
          </select>

          <label>Location</label>
          <input id="location" placeholder="Office, city, or team" />

          <label>Notes</label>
          <textarea id="notes" placeholder="Notes, kit contents, condition, etc."></textarea>

          <button type="submit">Add Asset</button>
        </form>
      </section>

      <section class="card inventory">
        <div class="section-head">
          <div>
            <h2>Inventory</h2>
            <p>Search, export, and manage tracked assets.</p>
          </div>

          <div class="actions">
            <button id="exportJson">Export JSON</button>
            <button id="exportCsv">Export CSV</button>
          </div>
        </div>

        <input id="search" class="search" placeholder="Search by asset, serial, employee, status..." />

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Asset ID</th>
                <th>Type</th>
                <th>Serial / ID</th>
                <th>Assigned To</th>
                <th>Status</th>
                <th>Location</th>
                <th></th>
              </tr>
            </thead>

            <tbody id="assetTable"></tbody>
          </table>
        </div>
      </section>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
